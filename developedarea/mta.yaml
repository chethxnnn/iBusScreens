_schema-version: "3.3"
ID: DevelopedArea
version: 1.0.0

modules:
  - name: developedarea-ui
    type: html5
    path: .
    build-parameters:
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      build-result: dist
      supported-platforms: []

  - name: developedarea-content
    type: com.sap.application.content
    path: .
    requires:
      - name: DevelopedArea-html5-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - name: developedarea-ui
          artifacts:
            - developedarea-ui.zip
          target-path: resources/

  - name: developedarea-destination-content
    type: com.sap.application.content
    requires:
      - name: DevelopedArea-Destination
        parameters:
          content-target: true
      - name: DevelopedArea-html5-repo-host
        parameters:
          service-key:
            name: DevelopedArea-html5-repo-host-key
      - name: DevelopedArea-XSUAA
        parameters:
          service-key:
            name: DevelopedArea-XSUAA-key
    parameters:
      content:
        instance:
          existing_destinations_policy: update
          destinations:
            - Name: developedarea_html_repo_host
              ServiceInstanceName: DevelopedArea-html5-repo-host
              ServiceKeyName: DevelopedArea-html5-repo-host-key
              sap.cloud.service: developedarea
            - Name: developedarea_uaa
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: DevelopedArea-XSUAA
              ServiceKeyName: DevelopedArea-XSUAA-key
              sap.cloud.service: developedarea
    build-parameters:
      no-source: true

resources:
  - name: DevelopedArea-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  - name: DevelopedArea-html5-repo-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime

  - name: DevelopedArea-Destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
        version: 1.0.0

  - name: DevelopedArea-XSUAA
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
