_schema-version: "3.3"
ID: CustomerAgreement
version: 1.0.0

modules:
  - name: customeragreement-ui
    type: html5
    path: .
    build-parameters:
      builder: custom
      commands:
        - npm install
        - npm run build
      build-result: approuter/resources
      supported-platforms: []

  - name: CustomerAgreement-content
    type: approuter.nodejs
    path: approuter
    parameters:
      memory: 256M
      disk-quota: 512M

    requires:
      - name: CustomerAgreement-Destination
      - name: CustomerAgreement-Connectivity
      - name: CustomerAgreement-XSUAA
    provides:
      - name: approuter-api
        properties:
          url: ${default-url}

resources:
  - name: CustomerAgreement-Destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite

  - name: CustomerAgreement-Connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite

  - name: CustomerAgreement-XSUAA
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json